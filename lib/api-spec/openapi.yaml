openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: PWD NIT Document Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contractors
    description: Contractor address register
  - name: nit
    description: NIT session management
  - name: documents
    description: Document generation
  - name: parse
    description: Tender document parsing

security:
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: [] # health stays public
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── CONTRACTORS ────────────────────────────────────────────────────────────
  /contractors:
    get:
      operationId: listContractors
      tags: [contractors]
      summary: List all contractors (with optional search)
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name (partial match)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of contractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contractor"
    post:
      operationId: createContractor
      tags: [contractors]
      summary: Add a new contractor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorInput"
      responses:
        "201":
          description: Contractor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"

  /contractors/{id}:
    get:
      operationId: getContractor
      tags: [contractors]
      summary: Get contractor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
    put:
      operationId: updateContractor
      tags: [contractors]
      summary: Update contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
    delete:
      operationId: deleteContractor
      tags: [contractors]
      summary: Delete contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /contractors/stats:
    get:
      operationId: getContractorStats
      tags: [contractors]
      summary: Contractor database stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorStats"

  # ─── NIT SESSIONS ────────────────────────────────────────────────────────────
  /nit-sessions:
    get:
      operationId: listNitSessions
      tags: [nit]
      summary: List all NIT sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NitSession"
    post:
      operationId: createNitSession
      tags: [nit]
      summary: Create a new NIT session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NitSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NitSession"

  /nit-sessions/{id}:
    get:
      operationId: getNitSession
      tags: [nit]
      summary: Get NIT session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NitSession"
        "404":
          description: Not found
    put:
      operationId: updateNitSession
      tags: [nit]
      summary: Update NIT session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NitSessionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NitSession"
    delete:
      operationId: deleteNitSession
      tags: [nit]
      summary: Delete NIT session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /nit-sessions/{id}/summary:
    get:
      operationId: getNitSessionSummary
      tags: [nit]
      summary: Get computed summary (stamp duty, APS, totals) for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Summary with computed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NitSessionSummary"

  # ─── PARSE ───────────────────────────────────────────────────────────────────
  /parse/challan-pdf:
    post:
      operationId: parseChallanPdf
      tags: [parse]
      summary: Parse eGross Challan + DIPR Publication PDF (send as base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Parsed data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedPdfData"

  /parse/excel-upload:
    post:
      operationId: parseExcelUpload
      tags: [parse]
      summary: Parse the hand-curated master Excel (send as base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Parsed challan + DIPR data grouped by work S.No
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedExcelData"

  /parse/image-upload:
    post:
      operationId: parseImageUpload
      tags: [parse]
      summary: Parse challan / DIPR table from a screenshot or photo (base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: Parsed challan + DIPR data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedImageData"

  /parse/raw-text:
    post:
      operationId: parseRawText
      tags: [parse]
      summary: Parse tab-separated eGras challan table copied from the portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRawTextInput"
      responses:
        "200":
          description: Flat list of challan entries (workSno = 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedRawTextData"

  /parse/tender-case:
    post:
      operationId: parseTenderCase
      tags: [parse]
      summary: Parse a full tender case (NIT + opening + fee + publication)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderCaseInput"
      responses:
        "200":
          description: Parsed tender case ready to save as a NIT session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedTenderCase"

  /parse/folder:
    post:
      operationId: parseFolder
      tags: [parse]
      summary: Parse a local NIT-XX folder (filesystem access required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseFolderInput"
      responses:
        "200":
          description: Parsed tender case plus the classified input file paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedFolderResult"

  # ─── DOCUMENT GENERATION ─────────────────────────────────────────────────────
  /documents/generate:
    post:
      operationId: generateDocuments
      tags: [documents]
      summary: Generate required output documents for a NIT session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDocumentsInput"
      responses:
        "200":
          description: Generation result with download tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDocumentsResult"

  /documents/generate-batch:
    post:
      operationId: generateDocumentsBatch
      tags: [documents]
      summary: Generate all documents and write them to a local directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBatchInput"
      responses:
        "200":
          description: Per-document write results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBatchResult"

  /documents/download/{token}:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Download a generated document by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DOCX file download
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

  /documents/compute:
    post:
      operationId: computeValues
      tags: [documents]
      summary: Compute stamp duty and APS for given works (preview before generating)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeInput"
      responses:
        "200":
          description: Computed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeResult"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ── CONTRACTOR ────────────────────────────────────────────────────────────
    Contractor:
      type: object
      properties:
        id:
          type: integer
        sno:
          type: ["integer", "null"]
        name:
          type: string
        address:
          type: string
        contactNo:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, address]

    ContractorInput:
      type: object
      properties:
        sno:
          type: ["integer", "null"]
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        contactNo:
          type: ["string", "null"]
      required: [name, address]

    ContractorStats:
      type: object
      properties:
        totalContractors:
          type: integer
        recentlyAdded:
          type: integer
      required: [totalContractors, recentlyAdded]

    # ── NIT SESSION ───────────────────────────────────────────────────────────
    NitDetails:
      type: object
      properties:
        nitNo:
          type: string
        nitDate:
          type: string
        office:
          type: string
        signingAuthority:
          type: string
        diprRef:
          type: ["string", "null"]
        ubn:
          type: ["string", "null"]
      required: [nitNo, nitDate, office, signingAuthority]

    NegotiatedItem:
      type: object
      properties:
        description:
          type: string
        amount:
          type: number
      required: [description, amount]

    WorkDetails:
      type: object
      properties:
        sno:
          type: integer
        ubn:
          type: string
        nameOfWork:
          type: string
        gScheduleAmount:
          type: number
        bidAmount:
          type: ["number", "null"]
        bidRate:
          type: ["string", "null"]
        bidRatePercent:
          type: ["number", "null"]
        bidRateType:
          type: string
          enum: [above, below, item_rate]
        period:
          type: string
        status:
          type: string
          enum: [accepted, cancelled]
        bidderName:
          type: ["string", "null"]
        bidderAddress:
          type: ["string", "null"]
        bidderContact:
          type: ["string", "null"]
        aenSubDivision:
          type: ["string", "null"]
        stampDuty:
          type: ["number", "null"]
        aps:
          type: ["number", "null"]
        workOrderNo:
          type: ["string", "null"]
        commencementDate:
          type: ["string", "null"]
        completionDate:
          type: ["string", "null"]
        agreementNo:
          type: ["string", "null"]
        bsr:
          type: ["string", "null"]
        tenderValidity:
          type: ["string", "null"]
        authorityToAccept:
          type: ["string", "null"]
        recommendation:
          type: ["string", "null"]
        depositWorkRef:
          type: ["string", "null"]
        negotiationDate:
          type: ["string", "null"]
        negotiatedItems:
          type: array
          items:
            $ref: "#/components/schemas/NegotiatedItem"
        tendersSold:
          type: ["integer", "null"]
        tendersReceived:
          type: ["integer", "null"]
        responsiveBidders:
          type: ["integer", "null"]
        lastSubmissionDate:
          type: ["string", "null"]
        lastSubmissionTime:
          type: ["string", "null"]
        openingDate:
          type: ["string", "null"]
        financialBidOpeningDate:
          type: ["string", "null"]
      required: [sno, ubn, nameOfWork, gScheduleAmount, bidRateType, period, status]

    ChallanEntry:
      type: object
      properties:
        workSno:
          type: integer
        grnNo:
          type: string
        challanNo:
          type: string
        challanDate:
          type: string
        vendorName:
          type: string
        rislComm:
          type: number
        head0075Amount:
          type: number
        head8443Amount:
          type: number
      required: [workSno, grnNo, challanNo, challanDate, vendorName, rislComm, head0075Amount, head8443Amount]

    DiprEntry:
      type: object
      properties:
        srNo:
          type: integer
        newspaperName:
          type: string
        editionName:
          type: string
        advtSize:
          type: string
        sqCm:
          type: number
        releaseDate:
          type: string
        rate:
          type: number
        amount:
          type: number
      required: [srNo, newspaperName, editionName, advtSize, sqCm, releaseDate, rate, amount]

    DiprPublication:
      type: object
      properties:
        roNo:
          type: string
        releaseDate:
          type: string
        nitNo:
          type: string
        formIssuingDate:
          type: string
        tenderOpeningDate:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DiprEntry"
        totalAmount:
          type: number
      required: [roNo, releaseDate, entries, totalAmount]

    BgVerification:
      type: object
      properties:
        workSno:
          type: integer
        contractorName:
          type: ["string", "null"]
        contractorAddress:
          type: ["string", "null"]
        bankName:
          type: string
        bankBranch:
          type: ["string", "null"]
        bgFdrNo:
          type: string
        amount:
          type: number
        amountDate:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        letterNo:
          type: ["string", "null"]
        letterDate:
          type: ["string", "null"]
      required: [workSno, bankName, bgFdrNo, amount]

    NitSessionInput:
      type: object
      properties:
        title:
          type: string
        nitDetails:
          $ref: "#/components/schemas/NitDetails"
        works:
          type: array
          items:
            $ref: "#/components/schemas/WorkDetails"
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
        bgVerifications:
          type: array
          items:
            $ref: "#/components/schemas/BgVerification"
      required: [title, nitDetails, works]

    NitSession:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        nitDetails:
          $ref: "#/components/schemas/NitDetails"
        works:
          type: array
          items:
            $ref: "#/components/schemas/WorkDetails"
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
        bgVerifications:
          type: array
          items:
            $ref: "#/components/schemas/BgVerification"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, nitDetails, works, createdAt, updatedAt]

    NitSessionSummary:
      type: object
      properties:
        sessionId:
          type: integer
        totalWorks:
          type: integer
        acceptedWorks:
          type: integer
        cancelledWorks:
          type: integer
        totalBidValue:
          type: number
        totalStampDuty:
          type: number
        totalAps:
          type: number
        workComputations:
          type: array
          items:
            $ref: "#/components/schemas/WorkComputation"
      required: [sessionId, totalWorks, acceptedWorks, cancelledWorks, totalBidValue, totalStampDuty, totalAps, workComputations]

    WorkComputation:
      type: object
      properties:
        sno:
          type: integer
        nameOfWork:
          type: string
        bidAmount:
          type: ["number", "null"]
        bidAmountWords:
          type: ["string", "null"]
        stampDuty:
          type: ["number", "null"]
        aps:
          type: ["number", "null"]
        status:
          type: string
      required: [sno, nameOfWork, status]

    # ── PARSE ─────────────────────────────────────────────────────────────────
    ParseRawTextInput:
      type: object
      properties:
        rawText:
          type: string
          description: Tab-separated eGras challan table pasted from the portal
      required: [rawText]

    ParseFolderInput:
      type: object
      properties:
        dir:
          type: string
          description: Absolute path to the NIT-XX root or its Inputs subfolder
      required: [dir]

    FileUploadInput:
      type: object
      properties:
        fileBase64:
          type: string
          description: Base64-encoded file content
        filename:
          type: ["string", "null"]
      required: [fileBase64]

    ParsedPdfData:
      type: object
      properties:
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
        rawText:
          type: string
      required: [challanEntries, rawText]

    ParsedExcelData:
      type: object
      properties:
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
        workParticipantCounts:
          type: object
          additionalProperties:
            type: integer
      required: [challanEntries]

    ParsedImageData:
      type: object
      properties:
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
        flatList:
          type: boolean
      required: [challanEntries]

    ParsedRawTextData:
      type: object
      properties:
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        flatList:
          type: boolean
      required: [challanEntries, flatList]

    TenderCaseInput:
      type: object
      properties:
        nitPdfBase64:
          type: ["string", "null"]
        nitFileName:
          type: ["string", "null"]
        openingPdfBase64:
          type: ["string", "null"]
        openingFileName:
          type: ["string", "null"]
        feeFileBase64:
          type: ["string", "null"]
        feeFileName:
          type: ["string", "null"]
        publicationPdfBase64:
          type: ["string", "null"]
        publicationFileName:
          type: ["string", "null"]

    ParsedTenderCase:
      type: object
      properties:
        title:
          type: string
        nitDetails:
          $ref: "#/components/schemas/NitDetails"
        works:
          type: array
          items:
            $ref: "#/components/schemas/WorkDetails"
        challanEntries:
          type: array
          items:
            $ref: "#/components/schemas/ChallanEntry"
        diprPublication:
          oneOf:
            - $ref: "#/components/schemas/DiprPublication"
            - type: "null"
      required: [title, nitDetails, works]

    ParsedFolderResult:
      allOf:
        - $ref: "#/components/schemas/ParsedTenderCase"
        - type: object
          properties:
            inputDir:
              type: string
            files:
              type: object
              properties:
                nit: { type: string }
                opening: { type: string }
                fee: { type: string }
                publication: { type: string }
              required: [nit, opening, fee, publication]
          required: [inputDir, files]

    # ── DOCUMENT GENERATION ───────────────────────────────────────────────────
    DocumentType:
      type: string
      enum:
        - scrutiny_note
        - acceptance_letters
        - challan_verification
        - publication_cost
        - master_record
        - work_order
        - negotiation_letters
        - negotiation_reply
        - bank_bg_letters

    GenerateDocumentsInput:
      type: object
      properties:
        sessionId:
          type: integer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentType"
      required: [sessionId, documents]

    GeneratedDocument:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        downloadToken:
          type: string
        filename:
          type: string
        error:
          type: string
      required: [type, title, downloadToken, filename]

    GenerateDocumentsResult:
      type: object
      properties:
        sessionId:
          type: integer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedDocument"
        generatedAt:
          type: string
      required: [sessionId, documents, generatedAt]

    GenerateBatchInput:
      type: object
      properties:
        sessionData:
          $ref: "#/components/schemas/NitSessionInput"
        outputDir:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentType"
      required: [sessionData, outputDir]

    GeneratedBatchDocument:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        filename:
          type: string
        filePath:
          type: string
        error:
          type: string
      required: [type, title, filename, filePath]

    GenerateBatchResult:
      type: object
      properties:
        outputDir:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedBatchDocument"
        generatedAt:
          type: string
      required: [outputDir, documents, generatedAt]

    ComputeInput:
      type: object
      properties:
        works:
          type: array
          items:
            $ref: "#/components/schemas/WorkDetails"
      required: [works]

    ComputeResult:
      type: object
      properties:
        works:
          type: array
          items:
            $ref: "#/components/schemas/WorkComputation"
      required: [works]
